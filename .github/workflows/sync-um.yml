name: Sync UM course data

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "missing or all"
        required: true
        default: "missing"
        type: choice
        options:
          - missing
          - all
      limit:
        description: "Maximum number of courses to sync"
        required: true
        default: "200"

concurrency:
  group: sync-um
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync UM courses
        run: node scripts/sync-um.mjs --${{ github.event.inputs.mode || 'missing' }} --limit=${{ github.event.inputs.limit || '200' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          UM_OPEN_DATA_TOKEN: ${{ secrets.UM_OPEN_DATA_TOKEN }}
